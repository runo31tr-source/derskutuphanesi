<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ders Kütüphanesi</title>
<meta name="theme-color" content="#2f6bff"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1d2433;--mute:#667085;--line:#e4e7ef;--blue:#2f6bff;--green:#16a34a;--red:#d92d20;--atam:#c8102e;--hero1:#2f6bff;--hero2:#7b5cff;--okbg:#ecfdf3;--nobg:#fef3f2;--r:16px;color-scheme:light}
[data-theme=dark]{--bg:#0f1420;--card:#182033;--ink:#e8ebf3;--mute:#9aa4b8;--line:#2a3349;--blue:#6b95ff;--green:#3ccf74;--red:#ff6b5e;--atam:#ff4d6a;--okbg:rgba(60,207,116,.14);--nobg:rgba(255,107,94,.14);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;transition:background .2s,color .2s}
a{color:inherit}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line)}
.theme{font:inherit;font-size:13.5px;font-weight:800;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer;white-space:nowrap;margin-left:4px}
.topic summary::-webkit-details-marker{display:none}
.search input{color:var(--ink)}
.bar{max-width:1240px;margin:auto;display:flex;align-items:center;gap:10px;padding:7px 16px;flex-wrap:nowrap}
.logo{font-weight:900;font-size:19px;white-space:nowrap;flex:none;text-decoration:none;display:flex;align-items:center;gap:8px}
.logo span{background:var(--blue);color:#fff;border-radius:10px;padding:2px 9px}
nav{display:flex;gap:2px;align-items:center;flex-wrap:nowrap;flex:none}
nav a{text-decoration:none;font-weight:800;font-size:13.5px;white-space:nowrap;padding:6px 9px;border-radius:999px;color:var(--mute)}
nav a:hover{background:var(--bg);color:var(--ink)}
nav a.atam{background:var(--atam);color:#fff}
.search{flex:1 1 180px;max-width:300px;min-width:120px}
.search input{width:100%;padding:7px 13px;border:1px solid var(--line);border-radius:999px;font:inherit;background:var(--bg)}
main{max-width:1100px;margin:auto;padding:22px 18px 60px}
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;border-radius:24px;padding:34px 28px;margin-bottom:26px}
.hero h1{margin:0 0 6px;font-size:clamp(26px,4vw,40px);font-weight:900}
.hero p{margin:0;opacity:.92;font-size:17px}
h2{font-weight:900;margin:28px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;text-decoration:none;display:block;transition:.15s}
.tile:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(20,30,60,.08)}
.tile b{font-size:28px;font-weight:900;display:block}
.tile small{color:var(--mute);font-weight:600}
.lv1 b{color:#f59e0b}.lv2 b{color:#16a34a}.lv3 b{color:#2f6bff}
.ico{font-size:30px}
.crumb{color:var(--mute);font-weight:700;margin-bottom:6px}
.crumb a{text-decoration:none;color:var(--blue)}
.topic{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.topic summary{cursor:pointer;padding:16px 18px;font-weight:800;font-size:18px;list-style:none;display:flex;justify-content:space-between;gap:10px}
.topic summary::after{content:"＋";color:var(--blue)}
.topic[open] summary::after{content:"－"}
.tb{padding:0 18px 18px}
.box{background:var(--bg);border-radius:12px;padding:14px 16px;margin:10px 0}
.box h4{margin:0 0 6px;font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.opts{display:grid;gap:8px;margin-top:8px}
.opt{text-align:left;font:inherit;font-weight:700;color:var(--ink);padding:10px 14px;border:2px solid var(--line);background:var(--card);border-radius:10px;cursor:pointer}
.opt:hover{border-color:var(--blue)}
.opt.ok{border-color:var(--green);background:var(--okbg)}
.opt.no{border-color:var(--red);background:var(--nobg)}
.fb{font-weight:800;margin-top:8px}
.vids{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.yt{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:800;background:#ff0033;color:#fff;padding:9px 14px;border-radius:999px;font-size:14px}
.yt.alt{background:transparent;color:#ff0033;border:2px solid #ff0033}
.atam-hero{background:linear-gradient(135deg,#c8102e,#7a0019);color:#fff;border-radius:24px;padding:34px 28px}
.atam-hero h1{margin:0;font-size:clamp(28px,4vw,44px);font-weight:900}
.timeline{border-left:4px solid var(--atam);margin:18px 0 0 10px;padding-left:22px}
.ev{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.ev::before{content:"";position:absolute;left:-33px;top:18px;width:16px;height:16px;border-radius:50%;background:var(--card);border:4px solid var(--atam)}
.ev .y{color:var(--atam);font-weight:900}
.ev h3{margin:2px 0 4px}
.quotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.q{background:var(--card);border-left:5px solid var(--atam);border-radius:12px;padding:14px 16px;font-weight:700;font-style:italic}
.note{color:var(--mute);font-size:14px;margin-top:30px}
.res{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:8px;text-decoration:none;display:block}
.res small{color:var(--mute)}
footer{text-align:center;color:var(--mute);padding:24px 20px 40px;font-size:14px;border-top:1px solid var(--line)}
footer a{text-decoration:none;font-weight:800;color:var(--blue)}
.totop{position:fixed;right:18px;bottom:18px;width:46px;height:46px;border-radius:50%;border:none;background:var(--blue);color:#fff;font-size:22px;font-weight:900;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:.2s}
.totop.show{opacity:1;pointer-events:auto}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.stat{background:rgba(255,255,255,.18);border-radius:14px;padding:10px 16px;font-weight:800}
.stat b{display:block;font-size:24px;font-weight:900}
.done{color:var(--green);font-weight:900;margin-left:auto;margin-right:10px}
.prog{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 18px}
.prog i{display:block;height:100%;background:var(--green);border-radius:99px}
.about{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:14px}
.about h3{margin:0 0 6px}
.feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.feat .about{margin:0}
.feat .ico{font-size:28px}
.daily{border-left:6px solid var(--blue)}
.report-link{display:inline-block;margin-top:12px;font-size:14px;font-weight:700;color:var(--mute)}
.rform{display:grid;gap:14px}
.rform label{display:grid;gap:6px;font-weight:800}
.rform input,.rform select,.rform textarea{font:inherit;font-weight:600;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.send{font:inherit;font-weight:900;border:none;border-radius:999px;padding:12px 20px;background:var(--blue);color:#fff;cursor:pointer;justify-self:start}
.send:disabled{opacity:.6}
.hp{display:none}
.banner{display:flex;gap:14px;align-items:center;text-decoration:none;background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;border-radius:var(--r);padding:14px 18px;margin-bottom:6px;box-shadow:0 6px 16px rgba(239,68,68,.25)}
.banner span{font-size:30px}.banner b{display:block;font-size:19px;font-weight:900}.banner small{opacity:.92;font-weight:700}
.tool b{font-size:18px}.tools .tile{border-top:5px solid var(--blue)}
.news{position:relative}.news ul{margin:10px 0 0;padding-left:20px;line-height:1.8}
.tag{display:inline-block;font-size:13px;font-weight:900;border-radius:999px;padding:3px 12px;margin-bottom:6px;color:#fff}
.tag.soon{background:#ef4444}.tag.new{background:#16a34a}.tag.info{background:#2f6bff}.tag.old{background:#64748b}
.ftabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.ftab{font:inherit;font-weight:800;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer}.ftab.on{border-color:var(--blue);background:var(--blue);color:#fff}
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.fbar input{flex:1 1 220px;font:inherit;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.fcardx{font:inherit;text-align:left;display:grid;gap:4px;align-content:start;background:var(--card);color:var(--ink);border:1px solid var(--line);border-top:4px solid var(--blue);border-radius:16px;padding:14px 16px;cursor:pointer;min-height:110px}.fcardx small{color:var(--mute);font-weight:700}.fcardx b{font-size:17px}.fcardx .fval{font-size:18px;font-weight:800;color:var(--blue);font-family:ui-monospace,Consolas,monospace}.fcardx em{font-style:normal;color:var(--mute);font-size:14px}.fcardx .fhint{display:none;color:var(--mute);font-style:normal;font-size:13px}.fcardx.hid .fval,.fcardx.hid em{display:none}.fcardx.hid .fhint{display:block}
.sfilter{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.sfilter select{font:inherit;font-weight:700;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.res .snip{color:var(--mute);font-size:14px;margin-top:4px}mark{background:color-mix(in srgb,var(--blue) 25%,transparent);color:inherit;border-radius:4px;padding:0 2px}
.printdoc h1{font-size:28px;margin:10px 0 0}.psmall{color:var(--mute);margin:0 0 16px}.ptopic{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:12px}.ptopic h2{font-size:19px;margin:0 0 6px}.ptopic p{margin:0 0 8px}.pq{margin:6px 0}.pqo{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;margin:4px 0 0 10px;font-size:15px}.pans span{display:block;font-size:14px;margin:2px 0}
@media print{header,footer,.noprint,#player,.toast,.banner{display:none!important}body{background:#fff!important;color:#000!important}main{max-width:none;padding:0}.ptopic{break-inside:avoid;border:1px solid #bbb;background:#fff}.fgrid{grid-template-columns:1fr 1fr}.fcardx{break-inside:avoid;background:#fff;border:1px solid #bbb}.fbar,.ftabs,.hero,.crumb{display:none!important}}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--mute);font-weight:700;margin-top:6px}.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px}
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.gbox{display:grid;justify-items:center;gap:6px;text-align:center}.gbox h3{margin:6px 0 0}.gbox select{font:inherit;font-weight:700;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.gring{width:160px;height:160px;border-radius:50%;display:grid;place-items:center}.gin{width:126px;height:126px;border-radius:50%;background:var(--card);display:grid;place-content:center;text-align:center}.gin b{font-size:34px;line-height:1}.gin small{color:var(--mute);font-weight:700}
.swatches{display:flex;flex-wrap:wrap;gap:12px}.swatch{font:inherit;font-weight:800;display:flex;align-items:center;gap:10px;padding:10px 16px 10px 10px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}.swatch i{width:30px;height:30px;border-radius:50%;display:block}.swatch.on{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 25%,transparent)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}.mcol{display:grid;gap:10px;align-content:start}@media(max-width:640px){.mgrid{gap:8px}.mbtn{font-size:14px;padding:10px}}
.mbtn{font:inherit;font-weight:700;text-align:left;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:56px;transition:transform .15s}.mbtn.ans{background:var(--bg)}.mbtn.sel{border-color:var(--blue);transform:scale(1.02)}.mbtn.ok{border-color:var(--green);background:var(--okbg);opacity:.75;cursor:default}.mbtn.no{border-color:var(--red);background:var(--nobg)}.mbtn.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.gapsen{font-size:20px;font-weight:700;line-height:1.6;margin:6px 0 4px}.gap{display:inline-block;min-width:80px;border-bottom:3px solid var(--blue);color:var(--blue);text-align:center}.gap.gok{color:var(--green);border-color:var(--green)}.gap.gno{color:var(--red);border-color:var(--red)}
.yt.watch{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;border:0;font:inherit;font-weight:800;cursor:pointer}
#player{position:fixed;inset:0;z-index:80;background:rgba(8,12,24,.88);display:grid;place-items:center;padding:16px;animation:fadein .25s}
.pwrap{width:min(920px,100%);display:grid;gap:10px}
.pstage{position:relative;aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;display:grid;place-items:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
@media(max-width:640px){.pstage{aspect-ratio:auto;min-height:62vh}}
.pstage::before,.pstage::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}.pstage::before{width:340px;height:340px;top:-120px;right:-80px}.pstage::after{width:220px;height:220px;bottom:-90px;left:-60px}
.pscene{position:relative;z-index:1;text-align:center;padding:28px 34px 70px;max-width:820px;animation:sceneIn .55s ease both}
.pemo{font-size:clamp(48px,9vw,78px);animation:pop .6s ease both, bob 3s ease-in-out .6s infinite}
.pscene h2{font-size:clamp(26px,5vw,46px);margin:6px 0;font-weight:900;line-height:1.15}.pscene h3{font-size:clamp(20px,3.4vw,30px);margin:6px 0 14px}.pscene p{font-size:clamp(20px,3.4vw,32px);font-weight:800;line-height:1.35;margin:8px 0}.pscene small{font-size:clamp(14px,2.2vw,19px);opacity:.9;font-weight:700}
.popts{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}.popts span{background:rgba(255,255,255,.16);border-radius:12px;padding:10px 14px;font-weight:800;animation:sceneIn .5s ease both}.popts span:nth-child(2){animation-delay:.12s}.popts span:nth-child(3){animation-delay:.24s}.popts span:nth-child(4){animation-delay:.36s}
.pscene.sc-a h2{background:rgba(22,163,74,.9);display:inline-block;padding:8px 22px;border-radius:16px}
.psub{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:2;width:max-content;max-width:92%;background:rgba(0,0,0,.6);padding:7px 14px;border-radius:10px;font-size:15px;font-weight:700;text-align:center}
.pbar{display:flex;gap:5px}.pbar i{flex:1;height:5px;border-radius:5px;background:rgba(255,255,255,.25)}.pbar i.d{background:#fff}.pbar i.c{background:linear-gradient(90deg,#fff,rgba(255,255,255,.4))}
.pctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pctl button{font:inherit;font-size:18px;font-weight:800;border:0;border-radius:999px;padding:9px 16px;background:rgba(255,255,255,.14);color:#fff;cursor:pointer}.pctl .pclose{margin-left:auto;font-size:15px}.pnote{color:#cbd5e1;font-size:13px}
@keyframes sceneIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}@keyframes bob{50%{transform:translateY(-8px)}}@keyframes fadein{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 20px;border-radius:16px;font-weight:700;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;align-items:center;gap:10px;transition:opacity .5s,transform .5s;max-width:92vw}.toast.out{opacity:0;transform:translate(-50%,20px)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:14px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:center;display:grid;gap:6px}.badge .be{font-size:44px}.badge small{color:var(--mute)}.badge.lock{opacity:.55;filter:grayscale(1)}.badge .prog{margin:4px 0 0}
.fcard{display:grid;place-content:center;gap:12px;width:100%;min-height:260px;border:2px solid var(--line);border-radius:24px;background:var(--card);color:var(--ink);font:inherit;padding:28px;cursor:pointer;text-align:center;margin:12px 0;box-shadow:0 8px 24px rgba(0,0,0,.06)}
.fcard.back{border-color:var(--blue);text-align:left}.ftitle{font-size:clamp(24px,4vw,34px);font-weight:900}.fdesc{font-size:18px;line-height:1.6}.fq{background:var(--bg);border-radius:12px;padding:12px;line-height:1.6}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin:16px 0}@media(max-width:900px){.week{grid-template-columns:1fr}}
.day{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;min-height:130px}.day.today{border:2px solid var(--blue)}.day h4{margin:0 0 6px}
.ptask{display:flex;gap:4px;align-items:flex-start;font-size:14px;padding:7px 0;border-top:1px dashed var(--line)}.ptask span{flex:1;word-break:break-word}.ptask.done span{text-decoration:line-through;color:var(--mute)}
.ptask button{font:inherit;border:0;background:none;cursor:pointer;padding:0 2px;color:var(--mute)}.news.oldv{opacity:.85}
.cont{display:flex;align-items:center;gap:14px;text-decoration:none;background:var(--card);border:1px solid var(--line);border-left:6px solid #16a34a;border-radius:16px;padding:14px 18px;margin-bottom:18px}.cont span{font-size:30px}.cont small{display:block;color:var(--mute)}
.rbars{display:grid;gap:8px}.rbar{display:grid;grid-template-columns:minmax(110px,180px) 1fr 70px;gap:10px;align-items:center}.rbar .prog{margin:0}
.topic-actions{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:12px}.topic-actions .report-link{margin-top:0}
.favbtn,.mini{font:inherit;font-weight:800;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
.favbtn.on{background:#fef3c7;border-color:#f59e0b;color:#92400e}
.testbar{display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-weight:800;margin:6px 0}
.ring{width:260px;height:260px;border-radius:50%;margin:16px auto;display:grid;place-items:center;background:var(--line)}
.ringin{width:220px;height:220px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:58px;font-weight:900}
.pomomode{font-weight:900;font-size:22px}
.res.fav{display:flex;justify-content:space-between;align-items:center;gap:10px}.res.fav a{text-decoration:none;flex:1}
.reveal summary{cursor:pointer;font-weight:800;color:var(--blue);margin-top:8px}
.note-card .nbody{white-space:pre-wrap;margin:6px 0}
.gbar{display:grid;grid-template-columns:90px 1fr 70px;gap:10px;align-items:center}.gbar .prog{margin:8px 0}.gbar small{color:var(--mute);font-weight:700;text-align:right}
@media(max-width:1020px){.bar{flex-wrap:wrap;row-gap:6px}nav{order:3;width:100%;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}.search{max-width:none}}
@media(max-width:700px){nav a,nav button{white-space:nowrap;flex:none}}
</style>
</head>
<body>
<header><div class="bar">
  <a class="logo" href="#"><span>📚</span>Ders Kütüphanesi</a>
  <div class="search"><input id="q" type="search" placeholder="Konu ara… (örn. kesirler)"></div>
  <nav><a href="#">Sınıflar</a><a href="#araclar">🧰 Araçlar</a><a href="#duyurular">📢 Duyurular</a><a href="#hakkimizda">Hakkımızda</a><a href="#sorun-bildir">⚠️ Sorun Bildir</a><a class="atam" href="#atam">🇹🇷 Atam</a><button class="theme" id="theme" type="button" aria-label="Temayı değiştir">🌙 Koyu</button></nav>

function hash(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function qHTML(q,opts,ans,key){
  let seed=hash(q), idx=opts.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){seed=(Math.imul(seed,1664525)+1013904223)>>>0;const j=seed%(i+1);[idx[i],idx[j]]=[idx[j],idx[i]]}
  return `<b>${esc(q)}</b><div class="opts" data-ans="${idx.indexOf(ans)}" data-key="${esc(key)}">`+idx.map((o,i)=>`<button class="opt" data-i="${i}">${"ABCD"[i]}) ${esc(opts[o])}</button>`).join("")+`</div><div class="fb"></div>`;
}

function testAnswer(btn){
  const T=TEST; if(!T||T.answered) return; T.answered=true;
  const Q=T.qs[T.i], i=+btn.dataset.i, ok=Q.order[i]===Q.a, btns=app.querySelectorAll(".topt"), ci=Q.order.indexOf(Q.a);
  btns[ci].classList.add("ok"); if(!ok) btn.classList.add("no");
  const fb=document.getElementById("tfb"); fb.textContent=ok?"✅ Doğru!":"❌ Yanlış. Doğru cevap: "+btns[ci].textContent; fb.style.color=ok?"var(--green)":"var(--red)";
  const r=T.res[Q.sb]||(T.res[Q.sb]={c:0,n:0});r.n++;if(ok)r.c++;
  if(ok){T.correct++; if(!Q.key.includes("#")){SOLVED.add(Q.key);saveSolved()}} else T.wrong.push({q:Q.q,a:Q.o[Q.a],label:Q.label});
  trackAnswer(Q.key,ok,Q.q,Q.o[Q.a]);
  document.getElementById("tnext").innerHTML=`<button class="send" type="button" data-act="tnext">${T.i+1<T.qs.length?"Sonraki soru →":"Sonucu gör 🏁"}</button>`;
}
function testResult(){
  const T=TEST; if(!T)return; clearInterval(testTimer); const n=T.qs.length, p=Math.round(T.correct/n*100), done=Object.values(T.res).reduce((a,r)=>a+r.n,0);
  const e=p>=85?"🏆":p>=70?"🎉":p>=50?"👍":"💪", msg=p>=85?"Harika! Konulara çok hâkimsin.":p>=70?"Çok iyi! Biraz daha tekrar ile mükemmel olur.":p>=50?"Fena değil! Yanlışlarını tekrar et.":"Pes etmek yok! Konuları tekrar edip yeniden dene.";
  lsSet("sinavSayisi",lsGet("sinavSayisi",0)+1);if(p===100&&n>=10)lsSet("kusursuz",1);if(T.s==="lgs"||T.s==="tyt"){const ms=lsGet("modSinav",{});ms[T.s]=1;lsSet("modSinav",ms)}
  const best=lsGet("enIyiSinav",{}),bk=T.g+"|"+T.s; if(T.src!=="wrong"&&(best[bk]==null||p>best[bk])){best[bk]=p;lsSet("enIyiSinav",best)}
  app.innerHTML=`<div class="crumb"><a href="#deneme">Deneme Sınavı</a> › Sonuç</div>
  <div class="hero" style="background:linear-gradient(135deg,#16a34a,#2f6bff);text-align:center"><div style="font-size:64px">${e}</div><h1>%${p} başarı</h1><p>${n} sorudan ${T.correct} doğru · Süre: ${fmtTime((Date.now()-T.start)/1000)} ${best[bk]!=null?" · En iyi skorun: %"+best[bk]:""}</p></div>
  <div class="about"><b>${T.timeup?"⏰ Süre doldu! "+done+" soruyu cevaplayabildin. ":""}${msg}</b></div>`+
  (Object.keys(T.res).length?`<h2>📊 Derslere göre sonuç</h2><div class="about rbars">`+Object.entries(T.res).map(([sb,r])=>{const q=Math.round(r.c/r.n*100);return `<div class="rbar"><b>${subjName(sb)}</b><div class="prog"><i style="width:${q}%"></i></div><span>${r.c}/${r.n} · %${q}</span></div>`}).join("")+`</div>`:"")+
  (T.wrong.length?`<h2>Yanlış yaptığın sorular</h2>`+T.wrong.map(w=>`<div class="about"><div class="crumb">${esc(w.label)}</div><b>${esc(w.q)}</b><div class="fb" style="color:var(--green)">Doğru cevap: ${esc(w.a)}</div></div>`).join(""):"")+
  `<div class="vids"><button class="send" type="button" data-act="tagain">🔁 Yeni sınav</button><a class="yt alt" href="#yanlislarim">❌ Yanlışlarım</a></div>`;
  TEST=null; checkBadges();
}

// ---- Pomodoro ----
const POMO={mode:"work",left:25*60,running:false,timer:null,done:lsGet("pomodoro",0),ctx:null};
const POMO_LEN={work:25*60,short:5*60,long:15*60};
function beep(){try{const c=POMO.ctx;if(!c)return;[0,0.35,0.7].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0.25,c.currentTime+t);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+t+0.3);o.start(c.currentTime+t);o.stop(c.currentTime+t+0.3)})}catch(e){}}
function pomoTick(){
  POMO.left--;
  if(POMO.left<=0){beep();
    if(POMO.mode==="work"){POMO.done++;lsSet("pomodoro",POMO.done);checkBadges();POMO.mode=POMO.done%4===0?"long":"short"} else POMO.mode="work";
    POMO.left=POMO_LEN[POMO.mode];}
  pomoDraw();
}
function pomoDraw(){
  const el=document.getElementById("pomotime");
  document.title=POMO.running?`${fmtTime(POMO.left)} · ${POMO.mode==="work"?"Çalışma":"Mola"}`:"Ders Kütüphanesi";
  if(!el) return;
  el.textContent=fmtTime(POMO.left);
  const total=POMO_LEN[POMO.mode], pct=(1-POMO.left/total)*100;
  document.getElementById("pomoring").style.background=`conic-gradient(${POMO.mode==="work"?"#ef4444":"#16a34a"} ${pct}%, var(--line) 0)`;
  document.getElementById("pomomode").textContent=POMO.mode==="work"?"🍅 Çalışma zamanı":POMO.mode==="short"?"☕ Kısa mola":"🌴 Uzun mola";
  document.getElementById("pomobtn").textContent=POMO.running?"⏸ Duraklat":"▶ Başlat";
  document.getElementById("pomodone").textContent=POMO.done;
}
function pomoPage(){
  app.innerHTML=`<div class="crumb"><a href="#">Ana Sayfa</a> › <a href="#araclar">Araçlar</a> › Pomodoro</div>
  <div class="hero" style="background:linear-gradient(135deg,#ef4444,#f59e0b)"><h1>⏱️ Pomodoro Sayacı</h1><p>25 dakika odaklan, 5 dakika dinlen. 4 turdan sonra 15 dakikalık uzun mola!</p></div>
  <div class="about" style="text-align:center"><div id="pomomode" class="pomomode"></div>
  <div class="ring" id="pomoring"><div class="ringin"><span id="pomotime"></span></div></div>
  <div class="vids" style="justify-content:center"><button class="send" type="button" id="pomobtn" data-act="pomo">▶ Başlat</button><button class="yt alt" type="button" data-act="pomoreset">↺ Sıfırla</button><button class="yt alt" type="button" data-act="pomoskip">⏭ Atla</button></div>
  <p>Bugüne kadar tamamlanan çalışma turu: <b id="pomodone"></b> 🍅</p>
  <div class="note">İpucu: Çalışırken telefonunu uzak tut, molada su iç ve biraz hareket et.</div></div>`;
  pomoDraw();
}
function pomoToggle(){
  try{if(!POMO.ctx)POMO.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  POMO.running=!POMO.running; clearInterval(POMO.timer); if(POMO.running) POMO.timer=setInterval(pomoTick,1000); pomoDraw();
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.classList.contains("topt")) return testAnswer(b);
  if(b.classList.contains("bopt")) return gapAnswer(b);
  if(b.dataset.watch!==undefined) return playTopic(b.dataset.watch);
  if(b.dataset.print!==undefined){const [pg,pi]=b.dataset.print.split("|");return printSubject(pg,+pi)}
  if(b.dataset.ftab!==undefined){FTAB=b.dataset.ftab;return formulasPage()}
  if(b.dataset.fflip!==undefined){b.classList.toggle("hid");return}
  if(b.dataset.pl!==undefined) return plCtl(b.dataset.pl);
  if(b.dataset.mq!==undefined||b.dataset.ma!==undefined) return matchClick(b);
  if(b.dataset.accent!==undefined){lsSet("renk",b.dataset.accent);applyAccent(b.dataset.accent);return themesPage()}
  if(b.dataset.mode!==undefined){setTheme(b.dataset.mode);return themesPage()}
  if(b.dataset.fav!==undefined){const k=b.dataset.fav;FAV.has(k)?FAV.delete(k):FAV.add(k);lsSet("favoriler",[...FAV]);checkBadges();b.textContent=FAV.has(k)?"★ Kaydedildi":"☆ Kaydet";b.classList.toggle("on",FAV.has(k));return}
  if(b.dataset.unfav!==undefined){FAV.delete(b.dataset.unfav);lsSet("favoriler",[...FAV]);return favPage()}
  if(b.dataset.delnote!==undefined) return confirmBtn(b,"Emin misin?",()=>{NOTES=NOTES.filter(n=>String(n.id)!==b.dataset.delnote);lsSet("notlar",NOTES);notesPage()});
  if(b.dataset.progdone!==undefined){const x=PROG.find(q=>String(q.id)===b.dataset.progdone);if(x){x.done=!x.done;lsSet("program",PROG)}return progPage()}
  if(b.dataset.progdel!==undefined){PROG=PROG.filter(q=>String(q.id)!==b.dataset.progdel);lsSet("program",PROG);return progPage()}
  const a=b.dataset.act; if(!a) return;
  if(a==="fhide"){FHIDE=!FHIDE;return formulasPage()}
  if(a==="fprint"||a==="doprint"){try{window.print()}catch(e){}return}
  if(a==="magain") return matchStart(MATCH.g,MATCH.s);
  if(a==="bagain") return gapStart(GAP.g,GAP.s);
  if(a==="bnext"){GAP.i++;return gapDraw()}
  if(a==="cflip"){CARD.flip=!CARD.flip;return cardShow()}
  if(a==="cknow") return cardMark(true);
  if(a==="cagain") return cardMark(false);
  if(a==="crestart"){const l=lsGet("sonKart",null);return l&&D[l.g]&&D[l.g][l.s]?cardStart(l.g,l.s):cardsSetup()}
  if(a==="progreset"){PROG.forEach(q=>q.done=false);lsSet("program",PROG);return progPage()}
  if(a==="progclear") return confirmBtn(b,"Emin misin? Tekrar bas",()=>{PROG=[];lsSet("program",PROG);progPage()});
  if(a==="tnext"){TEST.i++; return TEST.i<TEST.qs.length?testQuestion():testResult()}
  if(a==="tagain") return testSetup();
  if(a==="pomo") return pomoToggle();
  if(a==="pomoreset"){POMO.running=false;clearInterval(POMO.timer);POMO.mode="work";POMO.left=POMO_LEN.work;return pomoDraw()}
  if(a==="pomoskip"){POMO.left=1;return pomoTick()}
  if(a==="clearwrong") return confirmBtn(b,"Emin misin? Tekrar bas",()=>{WRONG={};lsSet("yanlislar",WRONG);wrongPage()});
  if(a==="resetall") return confirmBtn(b,"Her şey silinecek. Emin misin? Tekrar bas",()=>{SOLVED=new Set();saveSolved();WRONG={};lsSet("yanlislar",WRONG);ST={answered:0,correct:0,days:[]};lsSet("istatistik",ST);EARNED=[];lsSet("rozetler",EARNED);["sinavSayisi","kusursuz","kartSayisi","modSinav","hedefGun","hedefHafta","hedefTamam","haftaTamam","oyunSayisi","izleme"].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});statsPage()});
});

// ---- Bilgi kartları ----
let CARD=null;
function cardsSetup(){
  const gOpts=Object.keys(D).map(g=>`<option value="${g}">${g}. Sınıf</option>`).join("");
  app.innerHTML=`<div class="crumb"><a href="#">Ana Sayfa</a> › <a href="#araclar">Araçlar</a> › Bilgi Kartları</div>
  <div class="hero" style="background:linear-gradient(135deg,#ec4899,#8b5cf6)"><h1>🃏 Bilgi Kartları</h1><p>Kartın önünde konunun adı yazar. Önce kendin hatırlamaya çalış, sonra kartı çevirip kontrol et. Bilmediğin kartlar destenin sonuna eklenir.</p></div>
  <div class="about rform"><label>Sınıf<select id="cg">${gOpts}</select></label><label>Ders<select id="cs"></select></label><button class="send" id="cstart" type="button">▶ Kartlara başla</button></div>`;
  const cg=document.getElementById("cg"),cs=document.getElementById("cs");
  const fill=()=>{cs.innerHTML=Object.keys(D[cg.value]).map(s=>`<option value="${esc(s)}">${subjName(s)} (${D[cg.value][s].length} kart)</option>`).join("")};
  const last=lsGet("sonKart",null); if(last&&D[last.g]) cg.value=last.g; fill(); if(last&&[...cs.options].some(o=>o.value===last.s)) cs.value=last.s;
  cg.onchange=fill;
  document.getElementById("cstart").onclick=()=>cardStart(cg.value,cs.value);

function cardStart(g,s){lsSet("sonKart",{g,s});const deck=D[g][s].map((_,i)=>i);for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}

function gapWords(text){return (text.match(/[A-Za-zÇĞİÖŞÜçğıöşüÂâÎîÛû]+/g)||[]).filter(w=>w.length>=5&&!STOP.has(w.toLocaleLowerCase("tr")))}
function gapSetup(){app.innerHTML=`<div class="crumb"><a href="#oyunlar">Oyunlar</a> › Boşluk Doldurma</div>

function gapStart(g,s){const topics=D[g][s],items=[],all=new Set();
  topics.forEach(t=>gapWords(t[1]).forEach(w=>all.add(w)));
  topics.forEach(t=>{const sents=t[1].split(/(?<=[.!?])\s+/).filter(x=>gapWords(x).length);if(!sents.length)return;

    const dis=[...all].filter(x=>x.toLocaleLowerCase("tr")!==wl&&!sen.includes(x)).sort((a,b)=>sc2(b)-sc2(a)).slice(0,3);if(dis.length<3)return;

const PL={sc:[],i:0,on:false,voice:lsGet("ses",true),tok:0,timer:null};
function speakOK(){return "speechSynthesis" in window&&typeof SpeechSynthesisUtterance!=="undefined"}
function trVoice(){try{const vs=speechSynthesis.getVoices();return vs.find(v=>/^tr/i.test(v.lang))||null}catch(e){return null}}
function playTopic(key){const [g,s,name]=key.split("|"),t=(D[g]&&D[g][s]||[]).find(x=>x[0]===name);if(!t)return;
  const icons=["💡","📌","🔎","✨","🧠","📝"],sents=t[1].split(/(?<=[.!?])\s+/).filter(Boolean);
  PL.sc=[{k:"title",e:ICON[s]||"📘",h:t[0],sub:`${g}. Sınıf · ${subjName(s)}`,say:`${g}. sınıf ${subjName(s)} dersi. Bugünkü konumuz: ${t[0]}.`}]
   .concat(sents.map((x,i)=>({k:"text",e:icons[i%icons.length],h:x,say:x})))
   .concat([{k:"q",e:"❓",h:t[2],opts:t[3],say:"Şimdi bir soru. "+t[2]},{k:"a",e:"✅",h:t[3][t[4]],sub:"Doğru cevap",say:"Doğru cevap: "+t[3][t[4]]+"."},{k:"end",e:"🎉",h:"Tebrikler!",sub:"Bu konunun anlatımını bitirdin.",say:"Tebrikler, bu konuyu tamamladın!"}]);
  PL.i=0;PL.on=true;PL.key=key;
  let ov=document.getElementById("player");if(ov)ov.remove();
  ov=document.createElement("div");ov.id="player";ov.innerHTML=`<div class="pwrap" role="dialog" aria-label="Konu anlatımı"><div class="pstage" id="pstage"></div><div class="pbar" id="pbar"></div>
  <div class="pctl"><button type="button" data-pl="prev" title="Önceki">⏮</button><button type="button" data-pl="toggle" id="pltog" title="Oynat / Duraklat">⏸</button><button type="button" data-pl="next" title="Sonraki">⏭</button><button type="button" data-pl="voice" id="plvoice" title="Ses">${PL.voice?"🔊":"🔇"}</button><span class="pnote" id="pnote"></span><button type="button" data-pl="close" title="Kapat" class="pclose">✕ Kapat</button></div></div>`;
  document.body.appendChild(ov);document.body.style.overflow="hidden";
  plShow()}
function plStop(){PL.tok++;clearTimeout(PL.timer);try{if(speakOK())speechSynthesis.cancel()}catch(e){}}
function plShow(){plStop();const sc=PL.sc[PL.i],tok=PL.tok,st=document.getElementById("pstage");if(!st)return;
  st.innerHTML=`<div class="pscene sc-${sc.k}"><div class="pemo">${sc.e}</div>${sc.k==="title"?`<small>${esc(sc.sub)}</small><h2>${esc(sc.h)}</h2>`:sc.k==="q"?`<h3>${esc(sc.h)}</h3><div class="popts">${sc.opts.map((o,i)=>`<span>${"ABCD"[i]}) ${esc(o)}</span>`).join("")}</div>`:sc.k==="a"?`<small>${esc(sc.sub)}</small><h2>${esc(sc.h)}</h2>`:sc.k==="end"?`<h2>${esc(sc.h)}</h2><small>${esc(sc.sub)}</small>`:`<p>${esc(sc.h)}</p>`}</div><div class="psub">${esc(sc.say)}</div>`;
  document.getElementById("pbar").innerHTML=PL.sc.map((_,i)=>`<i class="${i<PL.i?"d":i===PL.i?"c":""}"></i>`).join("");
  document.getElementById("pltog").textContent=PL.on?"⏸":"▶";
  if(PL.i===PL.sc.length-1&&PL.key){lsSet("izleme",lsGet("izleme",0)+1);PL.key=null;checkBadges()}
  if(!PL.on)return;
  const next=()=>{if(tok!==PL.tok||!PL.on)return;if(PL.i<PL.sc.length-1){PL.i++;plShow()}else{PL.on=false;document.getElementById("pltog").textContent="↺"}};
  const readMs=Math.max(2800,sc.say.length*70),t0=Date.now(),note=document.getElementById("pnote");
  let vs=[];try{vs=speakOK()?speechSynthesis.getVoices():[]}catch(e){}
  const noTr=vs.length>0&&!trVoice();
  if(note)note.textContent=!PL.voice?"Ses kapalı · alt yazılı":!speakOK()||noTr?"Cihazında Türkçe ses yok · alt yazılı oynatılıyor":"";
  if(PL.voice&&speakOK()&&!noTr){try{const u=new SpeechSynthesisUtterance(sc.say);u.lang="tr-TR";const v=trVoice();if(v)u.voice=v;u.rate=0.95;
      let done=false;const fin=()=>{if(done)return;done=true;const left=Math.max(600,readMs*0.8-(Date.now()-t0));PL.timer=setTimeout(next,left)};u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);
      PL.timer=setTimeout(()=>{if(!done){done=true;try{speechSynthesis.cancel()}catch(e){}next()}},Math.max(6000,sc.say.length*160));return}catch(e){}}
  PL.timer=setTimeout(next,readMs);
}
function plCtl(a){
  if(a==="close"){plStop();PL.on=false;const ov=document.getElementById("player");if(ov)ov.remove();document.body.style.overflow="";return}
  if(a==="prev"){PL.i=Math.max(0,PL.i-1);PL.on=true;return plShow()}
  if(a==="next"){PL.i=Math.min(PL.sc.length-1,PL.i+1);PL.on=true;return plShow()}
  if(a==="toggle"){if(!PL.on&&PL.i===PL.sc.length-1)PL.i=0;PL.on=!PL.on;return plShow()}
  if(a==="voice"){PL.voice=!PL.voice;lsSet("ses",PL.voice);document.getElementById("plvoice").textContent=PL.voice?"🔊":"🔇";return plShow()}
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.getElementById("player"))plCtl("close")});

let SF={g:"*",s:"*",st:"all",q:""};
function search(term){
  SF.q=term.trim(); const t=SF.q.toLocaleLowerCase("tr"); if(!t){route();return}
  const subs=[...new Set((SF.g==="*"?Object.keys(D):[SF.g]).flatMap(g=>Object.keys(D[g])))];
  if(SF.s!=="*"&&!subs.includes(SF.s))SF.s="*";
  const res=[];
  for(const g in D){if(SF.g!=="*"&&g!==SF.g)continue;Object.keys(D[g]).forEach((s,i)=>{if(SF.s!=="*"&&s!==SF.s)return;D[g][s].forEach(tp=>{
    const key=g+"|"+s+"|"+tp[0],solved=SOLVED.has(key);
    if(SF.st==="un"&&solved||SF.st==="ok"&&!solved||SF.st==="fav"&&!FAV.has(key))return;
    const nm=tp[0].toLocaleLowerCase("tr"),ds=tp[1].toLocaleLowerCase("tr"),qs=[tp[2],...(tp[5]||[]).map(x=>x[0])].join(" ").toLocaleLowerCase("tr");
    let score=0,where="";if(nm.includes(t)){score=3;where="Konu adı"}else if(ds.includes(t)){score=2;where="Anlatım"}else if(qs.includes(t)){score=1;where="Soru"}else if(subjName(s).toLocaleLowerCase("tr").includes(t)){score=1;where="Ders"}
    if(!score)return;
    let snip=tp[1];const p=ds.indexOf(t);if(p>60)snip="…"+tp[1].slice(p-50);if(snip.length>150)snip=snip.slice(0,150)+"…";
    res.push({score,html:`<a class="res" href="#s${g}-d${i}"><b>${hl(tp[0],t)}</b>${solved?' <span class="done">✓</span>':""}<br><small>${g}. Sınıf · ${subjName(s)} · <i>${where}</i></small><div class="snip">${hl(snip,t)}</div></a>`})})})}
  res.sort((a,b)=>b.score-a.score);
  const opt=(v,l,cur)=>`<option value="${esc(v)}"${v===cur?" selected":""}>${l}</option>`;
  app.innerHTML=`<h2>🔍 “${esc(SF.q)}” için ${res.length} sonuç</h2>
  <div class="sfilter"><select id="sfg">${opt("*","Tüm sınıflar",SF.g)}${Object.keys(D).map(g=>opt(g,g+". Sınıf",SF.g)).join("")}</select>
  <select id="sfs">${opt("*","Tüm dersler",SF.s)}${subs.map(s=>opt(s,subjName(s),SF.s)).join("")}</select>
  <select id="sfst">${opt("all","Tüm konular",SF.st)}${opt("un","Çözmediklerim",SF.st)}${opt("ok","Çözdüklerim",SF.st)}${opt("fav","Kaydettiklerim",SF.st)}</select></div>`+
  (res.slice(0,150).map(r=>r.html).join("")+(res.length>150?`<div class="note">İlk 150 sonuç gösteriliyor. Filtrelerle aramayı daraltabilirsin.</div>`:"")||`<p>Sonuç bulunamadı. Filtreleri değiştir ya da başka bir kelime dene.</p><div class="vids"><a class="yt" href="${yt(SF.q+" konu anlatımı")}" target="_blank" rel="noopener">▶ YouTube'da ara</a></div>`);
  document.getElementById("sfg").onchange=e=>{SF.g=e.target.value;SF.s="*";search(SF.q)};
  document.getElementById("sfs").onchange=e=>{SF.s=e.target.value;search(SF.q)};
  document.getElementById("sfst").onchange=e=>{SF.st=e.target.value;search(SF.q)};
}
function hl(text,t){const s=esc(text),i=s.toLocaleLowerCase("tr").indexOf(esc(t));return i<0?s:s.slice(0,i)+"<mark>"+s.slice(i,i+esc(t).length)+"</mark>"+s.slice(i+esc(t).length)}

  h+=`<h2>⭐ Günün Sorusu</h2><div class="about daily"><div class="crumb">${dg}. Sınıf · ${subjName(ds)} · ${esc(dt[0])}</div>`+topicQ(dg,ds,dt)+`</div>`;
  h+=`<h2>🧰 Çalışma Araçları</h2>`+toolsGrid();
  LEVELS.forEach(([n,c,gs])=>{
    h+=`<h2>${n}</h2><div class="grid">`+gs.map(g=>`<a class="tile ${c}" href="#s${g}"><b>${g}. Sınıf</b><small>${Object.keys(D[g]).length} ders</small></a>`).join("")+`</div>`;
  });
  h+=`<h2>🇹🇷 Atam</h2><a class="tile" href="#atam" style="border-left:6px solid var(--atam)"><b style="color:var(--atam)">Mustafa Kemal Atatürk</b><small>Hayatı, zaferleri, inkılapları ve sözleri</small></a>`;
  app.innerHTML=h;
}
function grade(g){
  const subs=Object.keys(D[g]);
  app.innerHTML=`<div class="crumb"><a href="#">Sınıflar</a> › ${g}. Sınıf</div><h2>${g}. Sınıf Dersleri</h2><div class="grid">`+
  subs.map((s,i)=>`<a class="tile" href="#s${g}-d${i}"><div class="ico">${ICON[s]||"📘"}</div><b style="font-size:19px">${subjName(s)}</b><small>${D[g][s].length} konu</small></a>`).join("")+`</div>`;

function topicHTML(g,s,t,ti,open){
  const [name,desc,q,opts,ans]=t, key=g+"|"+s+"|"+name;
  return `<details class="topic"${open?" open":""}><summary>${esc(name)}${SOLVED.has(key)?'<span class="done">✓</span>':""}</summary><div class="tb">
  <div class="box"><h4>Konu Anlatımı</h4>${esc(desc)}</div>
  <div class="box"><h4>Örnek Soru</h4>`+qHTML(q,opts,ans,key)+`</div>`+extrasHTML(t,key)+`
  <div class="vids"><button class="yt watch" type="button" data-watch="${esc(key)}">🎬 Anlatımı izle</button><a class="yt" href="${yt(g+". sınıf "+subjName(s)+" "+name+" konu anlatımı")}" target="_blank" rel="noopener">▶ Konu anlatımı videoları</a>
  <a class="yt alt" href="${yt(g+". sınıf "+subjName(s)+" "+name+" soru çözümü")}" target="_blank" rel="noopener">▶ Soru çözümü videoları</a></div>
  <div class="topic-actions"><button class="favbtn${FAV.has(key)?" on":""}" type="button" data-fav="${esc(key)}">${FAV.has(key)?"★ Kaydedildi":"☆ Kaydet"}</button>
  <a class="report-link" href="#sorun-bildir" data-konu="${esc(g+". Sınıf · "+subjName(s)+" · "+name)}">⚠️ Bu konuda bir hata mı var? Bildir</a></div>
  </div></details>`;
}
function subject(g,i){
  const s=Object.keys(D[g])[i]; if(!s) return grade(g);
  lsSet("sonKonu",{h:`#s${g}-d${i}`,g,s,t:Date.now()});
  app.innerHTML=`<div class="crumb"><a href="#">Sınıflar</a> › <a href="#s${g}">${g}. Sınıf</a> › ${subjName(s)}</div>
  <h2>${ICON[s]||""} ${g}. Sınıf ${subjName(s)}</h2><div class="vids" style="margin:-4px 0 10px"><button class="mini" type="button" data-print="${g}|${i}">🖨️ Konu özetlerini yazdır / PDF</button></div>`+progHTML(D[g][s].filter(t=>SOLVED.has(g+"|"+s+"|"+t[0])).length,D[g][s].length)+D[g][s].map((t,ti)=>topicHTML(g,s,t,ti,ti===0)).join("")+
  `<div class="vids" style="margin-top:16px"><a class="yt alt" href="${yt(g+". sınıf "+subjName(s)+" tüm konular")}" target="_blank" rel="noopener">▶ ${g}. Sınıf ${subjName(s)} — tüm konular</a></div>`;
}

  if(document.getElementById("player"))plCtl("close");
  const h=location.hash.slice(1); let m;
  if(h==="atam") atam();
  else if(h==="hakkimizda") about();
  else if(h==="sorun-bildir") reportPage();
  else if(h==="duyurular") newsPage();
  else if(h==="araclar") toolsPage();
  else if(h==="deneme") testSetup();
  else if(h==="pomodoro") pomoPage();
  else if(h==="kaydedilenler") favPage();
  else if(h==="yanlislarim") wrongPage();
  else if(h==="notlarim") notesPage();
  else if(h==="istatistikler") statsPage();
  else if(h==="kartlar") cardsSetup();
  else if(h==="program") progPage();
  else if(h==="rozetler") badgesPage();
  else if(h==="oyunlar") gamesPage();
  else if(h==="eslestirme") matchSetup();
  else if(h==="bosluk") gapSetup();
  else if(h==="hedefler") goalsPage();
  else if(h==="temalar") themesPage();
  else if(h==="formuller") formulasPage();
  else if(m=h.match(/^s(\d+)-d(\d+)$/)) D[m[1]]?subject(+m[1],+m[2]):home();
  else if(m=h.match(/^s(\d+)$/)) D[m[1]]?grade(+m[1]):home();
  else home();
  window.scrollTo(0,0);
}
app.addEventListener("click",e=>{
  const b=e.target.closest(".opt"); if(!b||b.classList.contains("topt")||b.classList.contains("bopt")) return;
  const box=b.parentElement; if(box.dataset.done) return; box.dataset.done=1;
  const ans=+box.dataset.ans, i=+b.dataset.i, btns=box.querySelectorAll(".opt");
  btns[ans].classList.add("ok"); if(i!==ans) b.classList.add("no");
  const fb=box.nextElementSibling;
  fb.textContent=i===ans?"✅ Doğru! Aferin.":"❌ Yanlış. Doğru cevap: "+btns[ans].textContent;
  fb.style.color=i===ans?"var(--green)":"var(--red)";
  const qEl=box.previousElementSibling; trackAnswer(box.dataset.key,i===ans,qEl?qEl.textContent:"",btns[ans].textContent.replace(/^[A-D]\) /,""));
  if(i===ans&&box.dataset.key&&!SOLVED.has(box.dataset.key)){SOLVED.add(box.dataset.key);saveSolved();
    const sum=!box.dataset.key.includes("#")&&box.closest("details")&&box.closest("details").querySelector("summary");
    if(sum&&!sum.querySelector(".done"))sum.insertAdjacentHTML("beforeend",'<span class="done">✓</span>');

});
